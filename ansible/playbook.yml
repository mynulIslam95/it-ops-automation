---
- name: Northfield Linux workstation baseline
  hosts: linux
  become: true
  vars:
    extra_packages:
      - curl
      - vim
      - htop
      - ufw
    office_group: office
    share_path: /srv/office-share
  tasks:
    - name: Install baseline packages
      ansible.builtin.apt:
        name: "{{ extra_packages }}"
        state: present
        update_cache: true

    - name: Office group
      ansible.builtin.group:
        name: "{{ office_group }}"
        state: present

    - name: Share directory
      ansible.builtin.file:
        path: "{{ share_path }}"
        state: directory
        owner: root
        group: "{{ office_group }}"
        mode: "2770"

    - name: UFW allow SSH
      community.general.ufw:
        rule: allow
        port: "22"
        proto: tcp
      ignore_errors: true

    - name: UFW enabled
      community.general.ufw:
        state: enabled
      ignore_errors: true

    - name: Health check script
      ansible.builtin.copy:
        src: ../scripts/health-check.sh
        dest: /usr/local/sbin/health-check.sh
        mode: "0755"
